[pytest]
# Put the scraping/ root on sys.path so `parsers.*` and `scrapers.*` import as
# top-level packages — the same way main.py and the backend submission service
# import them. Without this, tests only collect when invoked from this dir.
pythonpath = .
testpaths =
    parsers/tests
    scrapers/tests
filterwarnings =
    ignore::DeprecationWarning
