name: Expire Deals

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:10, Singapore time.
    - cron: "10 3 * * *"
      timezone: "Asia/Singapore"

concurrency:
  group: expire-deals
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lobang/scraping

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Mark expired deals
        run: python -m database.update
